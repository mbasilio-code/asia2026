<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Asia 2026</title>
<link rel="manifest" href="./manifest.json">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14202B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asia 2026">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#EEF1F3; --card:#FFFFFF; --ink:#14202B; --muted:#6B7A87;
  --line:#DCE2E7; --acc:#0B6B58; --acc-soft:#E3EFEB;
  --amber:#B4791A; --red:#B3261E; --nav:rgba(255,255,255,.94);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0D141B; --card:#16202A; --ink:#E8EDF1; --muted:#8A99A6;
  --line:#26323D; --acc:#2FA98D; --acc-soft:#173029;
  --amber:#D89A3D; --red:#E5655C; --nav:rgba(22,32,42,.94);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  padding-bottom:calc(70px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:540px;margin:0 auto;padding:0 14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- encabezado ---------- */
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 6px}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{font-size:11px;color:var(--muted);margin-top:3px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{padding:20px 18px}
.hero .big{font-size:40px;font-weight:600;line-height:1;margin:6px 0 2px}
.hero .note{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.split .v{font-size:19px;font-weight:600;margin-top:3px}
.pos{color:var(--acc)} .neg{color:var(--red)} .warn{color:var(--amber)}

.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

/* ---------- lista tipo boleto ---------- */
.daygroup{margin-bottom:14px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.dayhead .d{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dayhead .s{font-size:11px;color:var(--muted)}
.dayhead .s b{font-weight:600;color:var(--ink)}
/* tira de disponible: la única cifra verificable de la lista */
.tira{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px}
.tira .big2{font-size:27px;font-weight:600;line-height:1.1;margin-top:3px}
.tira .tr{text-align:right}
.tira .tr .num{font-size:14px;font-weight:600;margin-top:3px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.stub{width:5px;align-self:stretch;flex:none;margin-right:7px;
  background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}
.row.ok .stub{background:var(--acc)}
.row .body{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ok .t{color:var(--muted)}
.row .m{font-size:11px;color:var(--muted);margin-top:1px}
.row .amt{text-align:right;flex:none}
.row .amt b{font-size:14px;font-weight:600;display:block}
/* etiqueta de qué es el número: antes era un saldo sin encabezado */
.row .amt span{font-size:9.5px;color:var(--muted);display:block;margin-top:1px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600}
/* toda la fila es tocable: ya no hay ✓ separado del cuerpo */
.hit{position:absolute;inset:0;cursor:pointer}
.row.medias .stub{background:repeating-linear-gradient(to bottom,var(--amber) 0 4px,transparent 4px 8px)}
.row.medias .t{font-weight:600}

/* ---------- controles ---------- */
.chips{display:flex;gap:6px;margin:2px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* los chips de país se ven todos de golpe: son una elección, no una lista larga */
.chips.wrap{flex-wrap:wrap;overflow:visible}
button{font-family:inherit}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--acc);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--red)}
/* botón grande del dashboard: registrar un gasto no planeado */
.btn.grande{padding:17px;font-size:16px;margin-bottom:12px;
  box-shadow:0 4px 14px rgba(11,107,88,.22)}
.fab{position:fixed;right:calc(50% - 270px + 16px);bottom:calc(84px + var(--safe-b));width:54px;height:54px;
  border-radius:50%;background:var(--ink);color:var(--bg);border:none;font-size:27px;line-height:1;
  box-shadow:0 6px 18px rgba(20,32,43,.28);cursor:pointer;z-index:40}
@media(max-width:572px){.fab{right:16px}}

/* ---------- barra inferior ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);z-index:50}
nav .inner{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:none;padding:9px 0 8px;font-size:10.5px;font-weight:600;
  color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- hoja inferior ---------- */
.veil{position:fixed;inset:0;background:rgba(20,32,43,.45);z-index:60;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b));
  max-width:540px;margin:0 auto;transform:translateY(101%);transition:transform .22s ease;
  max-height:92vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet h2{font-size:17px;margin:0 0 2px;font-weight:600}
.sheet .cap{font-size:12px;color:var(--muted);margin-bottom:16px}
label{display:block;margin-bottom:12px}
label .lb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  font-size:16px;font-family:inherit;background:var(--card);color:var(--ink)}
input.big{font-family:var(--mono);font-size:26px;font-weight:600;text-align:center;padding:14px}
textarea{font-family:var(--mono);font-size:12px;min-height:110px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:grid;gap:8px;margin-top:6px}
.conv{text-align:center;font-size:12.5px;color:var(--muted);margin:-6px 0 12px}

/* ---------- tablas de resumen ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{text-align:left;font-weight:500}
.tbl tr:last-child td{border-bottom:none}
.mini{height:4px;background:var(--line);border-radius:99px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:500;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.btn:active,.tick:active,.chip:active{transform:scale(.96)}
.fab:active{transform:scale(.92)}
.btn,.tick,.chip,.fab{transition:transform .08s ease}
.trip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;
  background:var(--acc-soft);color:var(--acc);font-size:11.5px;font-weight:600;flex:none}
.trip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* ---------- bolsas ---------- */
.rows > :last-child{border-bottom:none}
.row.bolsa .m{margin-bottom:5px}
.row.bolsa .mini{margin-top:0}
.expand{position:relative;z-index:3;margin-top:6px;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:10.5px;font-weight:600;cursor:pointer}
.subs{background:var(--bg);border-bottom:1px solid var(--line)}
.sub{display:grid;grid-template-columns:38px 1fr auto auto;gap:9px;align-items:baseline;
  padding:8px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:none}
.sub .sd{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sub .sc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .sl{color:var(--muted);font-size:10.5px}
.sub .sm{font-weight:600}
.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qk button{padding:11px 5px;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--ink);cursor:pointer;display:grid;gap:2px;justify-items:center}
.qk button .qe{font-size:19px;line-height:1.1}
.qk button .qn{font-size:11.5px;font-weight:600}
.qk button .qv{font-size:11px;font-weight:600;color:var(--acc);font-family:var(--mono)}
.qk button.off{opacity:.5}
.opts{display:flex;gap:6px;justify-content:center;margin-top:12px}
.opts button{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;
  cursor:pointer;padding:5px 9px;border-radius:8px;max-width:40%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.opts button:active{background:var(--line)}
.atajos{display:flex;gap:6px;margin:-4px 0 14px}
.atajos button{flex:1;padding:10px 3px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-family:var(--mono);font-size:12.5px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stats .v{font-size:18px;font-weight:600;margin-top:2px}
.nrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;background:none;border:none;border-bottom:1px solid var(--line);
  color:var(--ink);font-size:13px;text-align:left;cursor:pointer}
.nrow:last-child{border-bottom:none}
.nrow .nt{font-weight:500}
.nrow .ns{font-size:11px;color:var(--muted);margin-top:1px}
.srow{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:end;margin-bottom:10px}
.srow .lb2{font-size:12.5px;font-weight:500}
.srow .dd{font-size:10.5px;color:var(--muted);margin-top:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Viaje Asia 2026</h1>
    <div class="sub" id="hoy"></div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Agregar movimiento">+</button>

<nav><div class="inner">
  <button data-t="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-t="movs"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movimientos</button>
  <button data-t="resumen"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Resumen</button>
  <button data-t="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4M18.7 18.7l-1.4-1.4M6.7 6.7L5.3 5.3"/></svg>Ajustes</button>
</div></nav>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "asia2026-v1";
const MONEDAS = ["MXN","JPY","KRW","CNY","USD"];
const VIAJE_INI = "2026-08-29", VIAJE_FIN = "2026-09-25"; // fechas del viaje (editable)
const CATS = ["Hospedaje","Comida","Transporte","Traslados","Atracciones","Souvenirs","Conectividad","Hogar","Ingreso","Otro"];
const EMOJI = {Comida:"🍜", Traslados:"🚕", Souvenirs:"🎁", Hospedaje:"🏨", Transporte:"✈️",
               Atracciones:"🎟️", Conectividad:"📶", Hogar:"🏠", Ingreso:"💰", Otro:"💸"};
const PAISES = ["México","EUA","Japón","Corea","China"];
const MON_PAIS = {"México":"MXN", "EUA":"USD", "Japón":"JPY", "Corea":"KRW", "China":"CNY"};
const ATAJOS = {MXN:[100,200,500,1000], JPY:[500,1000,3000,5000], KRW:[5000,10000,30000,50000],
                CNY:[20,50,100,200], USD:[5,10,20,50]};
const TASAS_DEF = {MXN:1, JPY:0.125, KRW:0.0135, CNY:2.60, USD:18.50};
// bolsas de Souvenirs por tramo de país (montos y fechas editables desde Ajustes)
const SOUV = [
  {concepto:"Souvenirs EUA",   pais:"EUA",   ini:"2026-08-29", fin:"2026-09-26", monto:2000},
  {concepto:"Souvenirs Japón", pais:"Japón", ini:"2026-09-03", fin:"2026-09-11", monto:6000},
  {concepto:"Souvenirs Corea", pais:"Corea", ini:"2026-09-12", fin:"2026-09-15", monto:3000},
  {concepto:"Souvenirs China", pais:"China", ini:"2026-09-16", fin:"2026-09-24", monto:5000}
];

const SEED = [
 ["2026-08-08","Tren Tokyo - Kyoto","Transporte","gasto",2600],
 ["2026-08-08","Zumo flight","Transporte","gasto",2172],
 ["2026-08-11","Tren Kyoto - Osaka","Transporte","gasto",2600],
 ["2026-08-15","Ingreso quincenal","Ingreso","ingreso",70000],
 ["2026-08-15","Renta","Hogar","gasto",26850],
 ["2026-08-15","GreenHouse Shanghai","Atracciones","gasto",510],
 ["2026-08-21","Tren Beijing - Shanghai","Transporte","gasto",2600],
 ["2026-08-22","Shanghai Tower","Atracciones","gasto",930],
 ["2026-08-22","Shibuya Sky","Atracciones","gasto",600],
 ["2026-08-28","esim EUA","Conectividad","gasto",395],
 ["2026-08-28","VPN Asia","Conectividad","gasto",1200],
 ["2026-08-28","esim Asia","Conectividad","gasto",1100],
 ["2026-08-29","Hospedaje 1 LAX","Hospedaje","gasto",26722],
 ["2026-08-29","Comida (bolsa del bloque)","Comida","gasto",6000,{ini:"2026-08-29",fin:"2026-08-31"}],
 ["2026-08-29","Traslados (bolsa del bloque)","Traslados","gasto",2000,{ini:"2026-08-29",fin:"2026-08-31"}],
 ["2026-08-29","Souvenirs EUA","Souvenirs","gasto",2000,{ini:"2026-08-29",fin:"2026-09-26",pais:"EUA"}],
 ["2026-09-01","Ingreso quincenal","Ingreso","ingreso",70000],
 ["2026-09-01","Comida (bolsa del bloque)","Comida","gasto",12000,{ini:"2026-09-01",fin:"2026-09-14"}],
 ["2026-09-01","Traslados (bolsa del bloque)","Traslados","gasto",5000,{ini:"2026-09-01",fin:"2026-09-14"}],
 ["2026-09-03","Hospedaje Tokyo","Hospedaje","gasto",28340],
 ["2026-09-03","Souvenirs Japón","Souvenirs","gasto",6000,{ini:"2026-09-03",fin:"2026-09-11",pais:"Japón"}],
 ["2026-09-07","Premier Access (5 atracciones p/p)","Atracciones","gasto",2000],
 ["2026-09-08","Hospedaje Kyoto","Hospedaje","gasto",7331],
 ["2026-09-11","Hospedaje Osaka","Hospedaje","gasto",2668],
 ["2026-09-12","Hospedaje Seúl","Hospedaje","gasto",11315],
 ["2026-09-12","Souvenirs Corea","Souvenirs","gasto",3000,{ini:"2026-09-12",fin:"2026-09-15",pais:"Corea"}],
 ["2026-09-13","Ciudad Prohibida","Atracciones","gasto",350],
 ["2026-09-15","Ingreso quincenal","Ingreso","ingreso",70000],
 ["2026-09-15","Renta","Hogar","gasto",26850],
 ["2026-09-15","Comida (bolsa del bloque)","Comida","gasto",12000,{ini:"2026-09-15",fin:"2026-09-30"}],
 ["2026-09-15","Traslados (bolsa del bloque)","Traslados","gasto",5000,{ini:"2026-09-15",fin:"2026-09-30"}],
 ["2026-09-16","Hospedaje Beijing","Hospedaje","gasto",6413],
 ["2026-09-16","Souvenirs China","Souvenirs","gasto",5000,{ini:"2026-09-16",fin:"2026-09-24",pais:"China"}],
 ["2026-09-17","Muralla China","Atracciones","gasto",1550],
 ["2026-09-18","Teleférico y tobogán","Atracciones","gasto",1100],
 ["2026-09-21","Hospedaje Shanghai","Hospedaje","gasto",9612],
 ["2026-09-21","Paseo en barco Pudong","Atracciones","gasto",800],
 ["2026-09-22","Bund Sightseeing Tunnel","Atracciones","gasto",500],
 ["2026-09-25","Hospedaje 2 LAX","Hospedaje","gasto",3530],
 ["2026-10-01","Ingreso quincenal","Ingreso","ingreso",70000],
 ["2026-10-15","Ingreso quincenal","Ingreso","ingreso",70000],
 ["2026-10-15","Renta","Hogar","gasto",26850],
 ["2026-11-01","Ingreso quincenal","Ingreso","ingreso",70000]
];

function nuevoEstado(){
  return {
    ajustes:{ saldoInicial:40000, tasas:Object.assign({},TASAS_DEF),
              monedaUltima:"MXN", paisActual:"México" },
    movs: SEED.map((s,i)=>{
      const m = {
        id:"s"+i, fecha:s[0], concepto:s[1], categoria:s[2], tipo:s[3],
        montoPlan:s[4], estado:"por_pagar", cerradoAMano:false, nota:"",
        bolsa:false, pais:null, fechaInicio:null, fechaFin:null, abonos:[]
      };
      if(s[5]){
        m.bolsa=true; m.fechaInicio=s[5].ini; m.fechaFin=s[5].fin;
        m.pais=s[5].pais||null;   // sin país no sale en accesos rápidos; se etiqueta en Ajustes
      }
      return m;
    })
  };
}

/* Lleva cualquier estado (localStorage o respaldo .json de v1.x) al modelo de
   tres estados. La idea central: en v2 el ÚNICO registro de dinero movido son
   los abonos, así que todo `montoReal` de v1 se convierte en un abono sintético.

   Mapeo de los dos estados viejos a los tres nuevos:

     confirmado, ejercido>0 y montoReal===ejercido → pagado (cierre deliberado:
         así se veía una bolsa liquidada; NO se debe reabrir)
     confirmado en cualquier otro caso            → abono sintético por la
         diferencia y luego la regla normal: cubre el plan → pagado,
         no lo cubre → a_medias
     pendiente con abonos                         → a_medias
     pendiente sin abonos                         → por_pagar

   Es aritméticamente neutral en todas las clases menos una, y esa es
   deliberada: `confirmado + montoReal < montoPlan + sin abonos` es el registro
   que el botón de "Pagar" de v1.3 dejaba mal cerrado. Reabrirlo es justamente
   el objetivo de esta versión, y por definición devuelve el remanente al
   proyectado. `migrar()` es idempotente y no borra campos. Nunca cambia KEY. */
let REABIERTOS = 0;
function migrar(st){
  if(!st || !st.ajustes || !Array.isArray(st.movs)) return st;
  const t = st.ajustes.tasas = st.ajustes.tasas || {};
  MONEDAS.forEach(k=>{ if(typeof t[k]!=="number" || !(t[k]>0)) t[k]=TASAS_DEF[k]; });
  if(!MONEDAS.includes(st.ajustes.monedaUltima)) st.ajustes.monedaUltima = "MXN";
  if(!PAISES.includes(st.ajustes.paisActual)) st.ajustes.paisActual = "México";
  REABIERTOS = 0;
  st.movs.forEach(m=>{
    if(typeof m.bolsa !== "boolean") m.bolsa = /\(bolsa del bloque\)/i.test(m.concepto||"");
    if(!Array.isArray(m.abonos)) m.abonos = [];
    if(m.nota == null) m.nota = "";
    if(m.pais === undefined) m.pais = null;
    if(typeof m.cerradoAMano !== "boolean") m.cerradoAMano = false;

    if(m.estado==="confirmado" || m.estado==="pendiente"){   // viene de v1.x
      const ej = ejercido(m);
      if(m.estado==="confirmado"){
        const mr = (typeof m.montoReal==="number") ? m.montoReal : m.montoPlan;
        if(ej>0 && mr===ej){
          m.cerradoAMano = true;                 // liquidación deliberada, se respeta
        }else if(mr>ej){
          m.abonos.push({ id:"mg-"+m.id, fecha:m.fecha, monto:mr-ej,
            moneda:m.moneda||null, montoLocal:(m.montoLocal==null?null:m.montoLocal),
            concepto:"Pago registrado antes" });
          if(mr < m.montoPlan) REABIERTOS++;      // el caso de la renta
        }
      }
      delete m.estado;                            // lo recalcula sync()
    }
    sync(m);
  });
  return st;
}

/* ---------------- utilidades ---------------- */
const fmt = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n||0);
const fmtS = n => (n>0?"+":"") + fmt(n);
const hoyISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const aDate = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const fechaLarga = iso => new Intl.DateTimeFormat("es-MX",{weekday:"short",day:"numeric",month:"short"}).format(aDate(iso));
const signo = m => m.tipo==="ingreso" ? 1 : -1;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Fecha de RESERVA: cuándo el dinero deja de estar disponible, que no siempre es
   cuándo se gasta. Una bolsa se reserva al abrir su tramo (`fechaInicio`, que ya
   existe y ya trae el valor correcto tanto para quincenas como para tramos de
   país); todo lo demás se reserva en su fecha. Sin campo nuevo y sin ninguna
   regla de quincena incrustada en el código. */
const fechaRes = m => m.fechaInicio || m.fecha;
const orden = () => S.movs.slice().sort((a,b)=>{
  const fa=fechaRes(a), fb=fechaRes(b);
  return fa===fb ? (signo(b)-signo(a)) : fa.localeCompare(fb);
});
const quincena = iso => { const [y,m,d]=iso.split("-").map(Number); return y+"-"+String(m).padStart(2,"0")+"-Q"+(d<15?1:2); };
const diaCorto = iso => new Intl.DateTimeFormat("es-MX",{day:"numeric",month:"short"}).format(aDate(iso));

/* =================== LOS TRES ESTADOS ===================

   por_pagar → sin abonos
   a_medias  → tiene abonos pero no cubren el plan
   pagado    → los abonos cubren el plan, o se cerró a mano

   `estado` se persiste (para que el respaldo sea legible) pero SIEMPRE lo
   recalcula sync(). Nunca se asigna a mano desde la UI: así es imposible que
   un movimiento a medias termine marcado como pagado, que es justo el bug
   que originó esta versión.

   El único registro de dinero movido son los abonos: no hay `montoReal`. Con
   eso bolsas y gastos comparten una sola aritmética, sin una sola rama. */
const ejercido = m => (m.abonos||[]).reduce((a,x)=>a+(Number(x.monto)||0),0);
const esPagado = m => m.estado === "pagado";
const aMedias  = m => m.estado === "a_medias";
const abierto  = m => m.estado !== "pagado";
const falta    = m => Math.max(0, m.montoPlan - ejercido(m));

/* Recalcula el estado. Devuelve true si ACABA de quedar cubierto (para el aviso). */
function sync(m){
  if(!Array.isArray(m.abonos)) m.abonos = [];
  const antes = m.estado, ej = ejercido(m);
  m.estado = (m.cerradoAMano || (ej>0 && ej>=m.montoPlan)) ? "pagado"
           : (ej>0 ? "a_medias" : "por_pagar");
  return m.estado==="pagado" && antes!=="pagado";
}

/* real(m): dinero que YA se movió.
   proy(m): lo que sigue comprometido ADEMÁS de real(m).
   Un movimiento a medias aporta a los dos: lo abonado a real, lo que falta a
   proy. Por eso abonar no mueve el proyectado: cada peso que sale de caja sale
   también de lo comprometido. */
const real     = m => signo(m) * ejercido(m);
const proy     = m => esPagado(m) ? 0 : signo(m) * falta(m);
/* efectivo = real + proy → −max(plan, ejercido) mientras siga abierto, que es
   lo que necesita el saldo corrido de listaHTML. */
const efectivo = m => real(m) + proy(m);
/* magnitud realmente gastada/recibida (0 si nadie ha pagado nada) */
const gastoReal = m => Math.abs(real(m));

/* Regla A: el sobregiro se reconoce en la desviación de inmediato;
   el ahorro sólo al cerrar. */
const desvDe = m => esPagado(m) ? signo(m)*(ejercido(m)-m.montoPlan)
                                : -Math.max(0, ejercido(m)-m.montoPlan);

/* Accesos rápidos: las bolsas abiertas del país seleccionado en Ajustes.
   No hay resolutor: el país lo eliges tú al aterrizar y decide todo. Las fechas
   no participan; si dos bolsas comparten país salen las dos, ordenadas por
   fecha, sin desempates invisibles. */
const paisActual  = () => S.ajustes.paisActual || "México";
const monedaPais  = p => MON_PAIS[p || paisActual()] || "MXN";
const bolsasDelPais = (p) => S.movs
  .filter(m => m.bolsa && abierto(m) && m.pais === (p || paisActual()))
  .sort((a,b) => a.fecha.localeCompare(b.fecha));
/* lo que falta pagar, en una sola lista: por_pagar y a_medias juntos */
const porPagar = () => orden().filter(m => abierto(m) && m.tipo==="gasto");

/* ---- las dos cifras que el usuario puede verificar ----
   saldoReal   = lo que hay en la bolsa ahora
   disponible  = saldoReal menos TODO lo que sigue comprometido y sin pagar

   `disponible()` es la única definición: la usan el Dashboard y la tira de
   Movimientos, así que no pueden discrepar. Es invariante ante cualquier abono
   (pagar baja el saldo real y baja el compromiso en la misma cantidad); sólo se
   mueve al sobregirarse o al cerrar algo liberando su remanente. Ésa es la
   propiedad que hace que el dinero de una bolsa NUNCA se vea disponible: se
   descuenta desde que la bolsa existe, sin importar su fecha. */
const saldoReal  = () => S.ajustes.saldoInicial + S.movs.reduce((a,m)=>a+real(m),0);
const disponible = () => saldoReal() + S.movs.reduce((a,m)=>a+proy(m),0);

function calc(){
  const saldoReal_ = saldoReal();
  const saldoProy = disponible();
  const desv = S.movs.reduce((a,m)=>a+desvDe(m), 0);
  return { saldoReal: saldoReal_, saldoProy, desv,
           pagados: S.movs.filter(esPagado).length,
           abiertos: S.movs.filter(abierto).length,
           gastadoViaje: S.movs.filter(m=>m.tipo==="gasto"&&m.categoria!=="Hogar")
                               .reduce((a,m)=>a+gastoReal(m),0) };
}

/* ---------------- estado persistido ----------------
   Se carga DESPUÉS de la aritmética porque migrar() usa ejercido() y sync(). */
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || nuevoEstado(); }catch(e){ S = nuevoEstado(); }
if(!S || !S.ajustes || !Array.isArray(S.movs)) S = nuevoEstado();
migrar(S);

function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ aviso("No se pudo guardar"); } }

function aviso(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1900); }

/* ---------------- hoja inferior ---------------- */
const veil=document.getElementById("veil"), sheet=document.getElementById("sheet");
function abrir(html){ sheet.innerHTML=html; veil.classList.add("on"); requestAnimationFrame(()=>sheet.classList.add("on")); }
function cerrar(){ sheet.classList.remove("on"); veil.classList.remove("on"); }
veil.onclick = cerrar;

/* ---------------- vistas ---------------- */
let tab="inicio";
const view=document.getElementById("view");
let _dia = hoyISO();
function pintaHeader(){
  const hoy=hoyISO();
  let chip="";
  if(hoy<VIAJE_INI){
    const f=Math.round((aDate(VIAJE_INI)-aDate(hoy))/864e5);
    chip=`<div class="trip">${f===1?"El viaje empieza mañana":"Faltan "+f+" días para el viaje"}</div>`;
  }else if(hoy<=VIAJE_FIN){
    const d=Math.round((aDate(hoy)-aDate(VIAJE_INI))/864e5)+1;
    const t=Math.round((aDate(VIAJE_FIN)-aDate(VIAJE_INI))/864e5)+1;
    chip=`<div class="trip">Día ${d} de ${t} del viaje</div>`;
  }
  document.getElementById("hoy").innerHTML = "Hoy es " + fechaLarga(hoy) + chip;
}
pintaHeader();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && hoyISO()!==_dia){ _dia=hoyISO(); pintaHeader(); render(); }
});

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  // el FAB sólo en Movimientos: en Inicio ya está el botón grande de registrar gasto
  document.getElementById("fab").style.display = (tab==="movs") ? "block" : "none";
  view.innerHTML = ({inicio:vInicio, movs:vMovs, resumen:vResumen, ajustes:vAjustes})[tab]();
  enlazar();
}

let abiertos = new Set();   // ids de bolsas con sus abonos desplegados

function abonoHTML(b, a){
  const loc = (a.moneda && a.moneda!=="MXN" && a.montoLocal!=null)
    ? a.montoLocal.toLocaleString("es-MX")+" "+a.moneda : "";
  return `<div class="sub" data-bid="${b.id}" data-aid="${a.id}">
    <span class="sd">${diaCorto(a.fecha)}</span>
    <span class="sc">${esc(a.concepto||"Gasto suelto")}</span>
    <span class="sl num">${loc}</span>
    <span class="sm num">${fmt(a.monto)}</span>
  </div>`;
}
const subsHTML = b => b.abonos.slice()
  .sort((x,y)=>x.fecha===y.fecha ? String(x.id).localeCompare(String(y.id)) : x.fecha.localeCompare(y.fecha))
  .map(a=>abonoHTML(b,a)).join("");

/* UNA sola fila para todo: bolsas y gastos son lo mismo.
   Toda la fila es tocable y abre hojaMov. No hay botón ✓ ni overlay parcial:
   ese ✓ separado del cuerpo era la mitad de la confusión que causó el bug. */
/* El titular de la fila es SIEMPRE el remanente mientras algo siga abierto, y lo
   pagado cuando ya cerró. Nunca el plan: mostrar el plan de un movimiento a
   medias es lo que hacía que la Renta dijera 25,662 cuando faltaban 8,500.
   Debajo va la etiqueta de qué es ese número, no un saldo sin encabezado. */
function filaHTML(m){
  const ej=ejercido(m), plan=m.montoPlan, pag=esPagado(m), dif=ej-plan;
  const titular = pag ? ej : falta(m);
  const etiqueta = pag ? "pagado" : (m.tipo==="ingreso" ? "por cobrar" : "falta");
  const n = m.abonos ? m.abonos.length : 0, exp = abiertos.has(m.id);
  const cls = m.tipo==="ingreso" ? "pos" : "";
  let sub = m.categoria;
  if(aMedias(m))        sub += " · pagado "+fmt(ej)+" de "+fmt(plan);   // el renglón clave
  else if(pag && dif>0) sub += " · sobregiro "+fmt(dif);
  else if(pag && dif<0) sub += " · ahorro "+fmt(-dif);
  if(m.bolsa) sub += " · bolsa"+(m.pais?" "+m.pais:"");
  if(m.nota)  sub += " · "+m.nota;
  return `<div class="row ${pag?"ok":""} ${aMedias(m)?"medias":""}" data-id="${m.id}">
    <div class="stub"></div><div class="hit" data-act="abrir"></div>
    <div class="body"><div class="t">${esc(m.concepto)}</div><div class="m">${esc(sub)}</div>
      ${n?`<button class="expand" data-act="expand">${n} abono${n>1?"s":""} ${exp?"▴":"▾"}</button>`:""}</div>
    <div class="amt"><b class="${dif>0&&pag?"neg":cls}">${m.tipo==="ingreso"?"+":"−"}${fmt(titular).replace("-","")}</b>
      <span>${etiqueta}</span></div>
  </div>${(exp&&n)?`<div class="subs">${subsHTML(m)}</div>`:""}`;
}

/* Se agrupa por fecha de RESERVA, no de gasto: una bolsa aparece el día en que
   su dinero deja de estar disponible.

   Ya no hay saldo corrido por fila. Era una proyección a la fecha de cada
   movimiento: contaba el plan completo de lo ya abonado, daba por recibidos
   ingresos pendientes, y sobre todo NO restaba nada posterior a esa fecha, así
   que el dinero de las bolsas de septiembre se veía disponible en agosto. El
   número que sí se puede verificar es uno solo, el disponible, y va arriba. */
function listaHTML(movs){
  if(!movs.length) return `<div class="card"><div class="empty">Nada por aquí todavía.<br>Usa el botón + para registrar un movimiento.</div></div>`;
  // lo que falta por pagar en cada día, para el encabezado
  const porDia = {};
  movs.forEach(m=>{ const d=fechaRes(m); porDia[d]=(porDia[d]||0)+(m.tipo==="gasto"?falta(m):0); });
  let out="", dia=null;
  movs.forEach(m=>{
    const d = fechaRes(m);
    if(d!==dia){
      if(dia) out+="</div></div>";
      dia=d;
      out+=`<div class="daygroup"><div class="dayhead"><span class="d">${fechaLarga(dia)}</span>`
         + `<span class="s">${porDia[dia]>0?"falta <b class=\"num\">"+fmt(porDia[dia])+"</b>":"al día"}</span>`
         + `</div><div class="rows">`;
    }
    out+=filaHTML(m);
  });
  return out+"</div></div>";
}

/* La única cifra verificable de la lista, etiquetada. Sale de disponible(), la
   misma función que alimenta el Dashboard, así que no pueden discrepar. */
function tiraDisponible(){
  const d = disponible(), pend = S.movs.filter(m=>abierto(m)&&m.tipo==="gasto")
                                       .reduce((a,m)=>a+falta(m),0);
  return `<div class="card tira">
    <div><div class="eyebrow">Disponible tras compromisos</div>
      <div class="big2 num ${d<0?"neg":""}">${fmt(d)}</div></div>
    <div class="tr"><div class="eyebrow">Falta pagar</div>
      <div class="num">${fmt(pend)}</div></div>
  </div>`;
}

/* Accesos rápidos del país seleccionado. Si estás en México y no hay bolsas
   de México, el bloque simplemente no aparece. */
function tarjetaRapido(){
  const bs = bolsasDelPais();
  if(!bs.length) return "";
  return `<div class="card">
    <div class="eyebrow" style="margin-bottom:10px">Abonar en ${esc(paisActual())}</div>
    <div class="qk">${bs.map(m=>{
      const disp = falta(m);
      return `<button data-qk="${m.id}">
        <span class="qe">${EMOJI[m.categoria]||"💸"}</span>
        <span class="qn">${esc(m.categoria)}</span>
        <span class="qv" style="${ejercido(m)>m.montoPlan?"color:var(--red)":""}">${fmt(disp)}</span>
      </button>`;}).join("")}</div>
  </div>`;
}

/* "Me falta pagar": por_pagar y a_medias juntos, ordenados por fecha.
   Es la lista de trabajo, no un filtro. Un a_medias JAMÁS falta aquí. */
function tarjetaFalta(){
  const ms = porPagar();
  if(!ms.length) return `<div class="card"><div class="empty">Todo pagado. Nada pendiente.</div></div>`;
  return `<div class="card">
    <div class="eyebrow" style="margin-bottom:10px">Me falta pagar</div>
    ${ms.slice(0,12).map(m=>`<button class="nrow" data-mov="${m.id}">
      <span><span class="nt">${esc(m.concepto)}</span>
        <span class="ns">${diaCorto(fechaRes(m))} · ${esc(m.categoria)}${
          aMedias(m)?" · pagado "+fmt(ejercido(m))+" de "+fmt(m.montoPlan):""}</span></span>
      <span class="num" style="font-weight:600;white-space:nowrap">${fmt(falta(m))}</span>
    </button>`).join("")}
    ${ms.length>12?`<div class="ns" style="text-align:center;padding-top:10px;color:var(--muted)">y ${ms.length-12} más en Movimientos</div>`:""}
  </div>`;
}

function vInicio(){
  const c=calc();
  const dcls = c.desv<0?"neg":(c.desv>0?"pos":"");
  return `
  <div class="card hero">
    <div class="eyebrow">Saldo real</div>
    <div class="big num">${fmt(c.saldoReal)}</div>
    <div class="split">
      <div><div class="eyebrow">Disponible tras compromisos</div><div class="v num">${fmt(c.saldoProy)}</div></div>
      <div><div class="eyebrow">Desviación vs. plan</div><div class="v num ${dcls}">${fmtS(c.desv)}</div></div>
    </div>
  </div>
  ${tarjetaRapido()}
  <button class="btn grande" id="reg">＋&nbsp; Registrar gasto</button>
  ${tarjetaFalta()}`;
}

/* [Me falta pagar] [Pagado] [Todo] — el primero por defecto e incluye a_medias */
let filtro="falta";
const FILTROS = [["falta","Me falta pagar"],["pagado","Pagado"],["todo","Todo"]];
function vMovs(){
  const movs = orden().filter(m => filtro==="todo" ? true
                                 : filtro==="pagado" ? esPagado(m) : abierto(m));
  return `${tiraDisponible()}
    <div class="chips">
      ${FILTROS.map(([k,t])=>`<button class="chip ${filtro===k?"on":""}" data-f="${k}">${t}</button>`).join("")}
    </div>${listaHTML(movs)}`;
}

function vResumen(){
  const c=calc();
  // una sola tabla: planeado / pagado / falta. Las bolsas ya no son un caso aparte.
  const cats = CATS.map(cat=>{
    const ms=S.movs.filter(m=>m.categoria===cat && m.tipo==="gasto");
    return {cat,
      plan: ms.reduce((a,m)=>a+m.montoPlan,0),
      real: ms.reduce((a,m)=>a+gastoReal(m),0),
      falta: ms.reduce((a,m)=>a+falta(m)*(esPagado(m)?0:1),0)};
  }).filter(x=>x.plan>0 || x.real>0).sort((a,b)=>b.plan-a.plan);
  const maxc = Math.max(...cats.map(x=>x.plan),1);
  const totC = cats.reduce((a,x)=>({p:a.p+x.plan, r:a.r+x.real, f:a.f+x.falta}), {p:0,r:0,f:0});

  const qs=[...new Set(orden().map(m=>quincena(m.fecha)))];
  let s=S.ajustes.saldoInicial;
  const filasQ = qs.map(q=>{
    const ms=S.movs.filter(m=>quincena(m.fecha)===q);
    // parche: |efectivo| ya vale max(plan, ejercido) para una bolsa abierta
    const ing=ms.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+Math.abs(efectivo(m)),0);
    const gas=ms.filter(m=>m.tipo==="gasto").reduce((a,m)=>a+Math.abs(efectivo(m)),0);
    s = s+ing-gas;
    const [y,mm,qq]=q.split("-");
    const et=new Intl.DateTimeFormat("es-MX",{month:"short"}).format(new Date(+y,+mm-1,1));
    return `<tr><td>${et} ${qq==="Q1"?"1–14":"15–fin"}</td><td class="num pos">${fmt(ing)}</td><td class="num">${fmt(gas)}</td><td class="num"><b>${fmt(s)}</b></td></tr>`;
  }).join("");

  return `
  <div class="card">
    <div class="eyebrow" style="margin-bottom:12px">Gasto por categoría</div>
    <table class="tbl"><thead><tr><th>Categoría</th><th>Planeado</th><th>Pagado</th><th>Falta</th></tr></thead><tbody>
    ${cats.map(x=>`<tr><td>${esc(x.cat)}<div class="mini"><i style="width:${Math.round(x.plan/maxc*100)}%;background:${x.real>x.plan?"var(--red)":"var(--acc)"};opacity:.35"></i></div></td>
      <td class="num" style="color:var(--muted)">${fmt(x.plan)}</td>
      <td class="num ${x.real>x.plan?"neg":""}">${fmt(x.real)}</td>
      <td class="num">${fmt(x.falta)}</td></tr>`).join("")}
    <tr><td><b>Total</b></td><td class="num" style="color:var(--muted)">${fmt(totC.p)}</td>
      <td class="num"><b>${fmt(totC.r)}</b></td><td class="num"><b>${fmt(totC.f)}</b></td></tr>
    </tbody></table>
  </div>
  <div class="card">
    <div class="eyebrow" style="margin-bottom:12px">Por quincena</div>
    <table class="tbl"><thead><tr><th>Periodo</th><th>Entra</th><th>Sale</th><th>Saldo</th></tr></thead><tbody>${filasQ}</tbody></table>
  </div>
  <div class="card">
    <div class="eyebrow" style="margin-bottom:10px">Viaje</div>
    <table class="tbl"><tbody>
      <tr><td>Gastado en el viaje</td><td class="num">${fmt(c.gastadoViaje)}</td></tr>
      <tr><td>Movimientos por pagar</td><td class="num">${c.abiertos}</td></tr>
      <tr><td>Disponible tras compromisos</td><td class="num"><b>${fmt(c.saldoProy)}</b></td></tr>
    </tbody></table>
  </div>`;
}

function vAjustes(){
  const t=S.ajustes.tasas;

/* ---------------- acciones ---------------- */
const chipsMonedaHTML = sel =>
  `<div class="chips" id="mons">${MONEDAS.map(x=>`<button class="chip ${x===sel?"on":""}" data-mon="${x}">${x}</button>`).join("")}</div>`;

/* Abonar a CUALQUIER movimiento. Pide UNA sola cosa: el monto.
   Moneda, fecha y nota son enlaces discretos debajo del botón, no campos.
   `pre` precarga un monto en MXN (lo usa "Pagar el resto"). */
function hojaAbono(b, ab, volver, pre){
  const nuevo = !ab;
  const hoy = hoyISO();
  const conAtajos = !!b.bolsa;           // captura de calle: montos frecuentes
  ab = ab || {id:"a"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36),
              fecha:hoy, monto:0, moneda:null, montoLocal:null, concepto:""};
  /* La moneda por defecto sale del país actual, salvo al editar un abono ya
     capturado, que conserva la suya. Un monto precargado va siempre en MXN. */
  let mon = !nuevo ? (ab.moneda||"MXN") : (pre!=null ? "MXN" : monedaPais());
  if(!MONEDAS.includes(mon)) mon="MXN";
  const valIni = nuevo ? (pre!=null ? pre : "") : (mon==="MXN" ? ab.monto : ab.montoLocal);
  // en edición se despliega lo que ya trae valor propio
  let verMon = (!nuevo && mon!=="MXN") || (nuevo && mon!=="MXN");
  let verFec = !nuevo && ab.fecha!==hoy;
  let verCon = !nuevo && !!ab.concepto;
  const ej0 = ejercido(b);
  const cap = `llevas ${fmt(ej0)} de ${fmt(b.montoPlan)} · faltan ${fmt(falta(b))}`;
  abrir(`
    <h2>${nuevo?(pre!=null?"Pagar el resto de ":"Abonar a ")+esc(b.concepto):"Editar abono"}</h2>
    <div class="cap">${cap}</div>
    <div id="a-monwrap" style="display:${verMon?"block":"none"}">${chipsMonedaHTML(mon)}</div>
    <input class="big" type="number" inputmode="decimal" id="a-mon" value="${valIni==null?"":valIni}" placeholder="0">
    <div class="conv" id="a-conv"></div>
    ${conAtajos?`<div class="atajos" id="a-at"></div>`:""}
    <div class="acts"><button class="btn" id="a-ok">${nuevo?"Abonar":"Guardar abono"}</button></div>
    <div class="opts">
      <button type="button" id="o-mon">${mon} ▾</button>
      <button type="button" id="o-fec">${ab.fecha===hoy?"Hoy":diaCorto(ab.fecha)} ▾</button>
      <button type="button" id="o-con">${ab.concepto?esc(ab.concepto).slice(0,18):"+ nota"}</button>
    </div>
    <div id="a-fecwrap" style="display:${verFec?"block":"none"}">
      <label style="margin-top:10px"><span class="lb">Fecha del pago</span><input type="date" id="a-fec" value="${ab.fecha}"></label></div>
    <div id="a-conwrap" style="display:${verCon?"block":"none"}">
      <label style="margin-top:10px"><span class="lb">Nota (opcional)</span><input id="a-con" value="${esc(ab.concepto||"")}" placeholder="Ramen, primera exhibición…"></label></div>
    <div class="acts" style="margin-top:14px">
      ${nuevo?"":`<button class="btn danger" id="a-del">Eliminar abono</button>`}
      <button class="btn ghost" id="a-cx">${volver?"Volver":"Cancelar"}</button>
    </div>`);
  const inp=document.getElementById("a-mon"), conv=document.getElementById("a-conv");
  const at=document.getElementById("a-at");
  const fecIn=document.getElementById("a-fec"), conIn=document.getElementById("a-con");
  const enMXN = () => { const v=parseFloat(inp.value)||0; return mon==="MXN" ? Math.round(v) : Math.round(v*S.ajustes.tasas[mon]); };
  const pinta = () => {
    conv.textContent = mon==="MXN" ? "" : `= ${fmt(enMXN())} · tipo de cambio ${S.ajustes.tasas[mon]}`;
    document.getElementById("o-mon").textContent = mon+" ▾";
    if(at){
      at.innerHTML = (ATAJOS[mon]||[]).map(n=>`<button type="button" data-at="${n}">${n.toLocaleString("es-MX")}</button>`).join("");
      at.querySelectorAll("[data-at]").forEach(x=>x.onclick=()=>{ inp.value=x.dataset.at; pinta(); });
    }
  };
  const toggle = (wrap, ver, foco) => { wrap.style.display = ver?"block":"none"; if(ver&&foco) foco.focus(); };
  document.getElementById("o-mon").onclick=()=>{ verMon=!verMon; toggle(document.getElementById("a-monwrap"),verMon); };
  document.getElementById("o-fec").onclick=()=>{ verFec=!verFec; toggle(document.getElementById("a-fecwrap"),verFec); };
  document.getElementById("o-con").onclick=()=>{ verCon=!verCon; toggle(document.getElementById("a-conwrap"),verCon,conIn); };
  fecIn.onchange=()=>{ document.getElementById("o-fec").textContent = (fecIn.value===hoy?"Hoy":diaCorto(fecIn.value))+" ▾"; };
  document.getElementById("mons").onclick=e=>{
    const t=e.target.closest("[data-mon]"); if(!t) return;
    const antes=mon; mon=t.dataset.mon;
    const v=parseFloat(inp.value);
    if(!isNaN(v) && antes!==mon){   // reconvierte para no guardar unidades equivocadas
      const mxn = antes==="MXN" ? v : v*S.ajustes.tasas[antes];
      inp.value = mon==="MXN" ? Math.round(mxn) : Math.round(mxn/S.ajustes.tasas[mon]);
    }
    document.querySelectorAll("#mons .chip").forEach(c=>c.classList.toggle("on",c.dataset.mon===mon));
    pinta();
  };
  inp.oninput=pinta; pinta(); inp.focus();
  document.getElementById("a-ok").onclick=()=>{
    const v=parseFloat(inp.value);
    if(isNaN(v)||v<=0) return aviso("Escribe un monto válido");
    ab.monto = enMXN();
    ab.moneda = mon;
    ab.montoLocal = mon==="MXN" ? null : v;
    ab.concepto = conIn.value.trim();
    ab.fecha = fecIn.value || hoy;
    if(nuevo) b.abonos.push(ab);
    if(mon!=="MXN") S.ajustes.monedaUltima = mon;
    const cubre = sync(b);              // el estado SIEMPRE se recalcula, nunca se asigna
    guardar(); render();
    const cuanto = mon==="MXN" ? fmt(ab.monto) : v.toLocaleString("es-MX")+" "+mon;
    aviso(cubre ? b.concepto+" quedó pagado"  // aviso() usa textContent, no escapar aquí
                : `Abonado ${cuanto} · faltan ${fmt(falta(b))}`);
    if(cubre) cerrar(); else if(volver) hojaMov(b); else cerrar();
  };
  if(!nuevo) document.getElementById("a-del").onclick=()=>{
    b.abonos = b.abonos.filter(x=>x.id!==ab.id);
    sync(b);                            // borrar un abono puede reabrir el movimiento
    guardar(); render(); aviso("Abono eliminado");
    if(volver) hojaMov(b); else cerrar();
  };
  document.getElementById("a-cx").onclick=()=>{ if(volver) hojaMov(b); else cerrar(); };
}

/* LA hoja. Un toque en cualquier fila abre ésta y aquí se hace todo:
   ver lo pagado y lo que falta, abonar, pagar el resto, cerrar, editar, borrar.
   No hay una hoja para bolsas y otra para gastos: es la misma. */
function hojaMov(m){
  const ej=ejercido(m), plan=m.montoPlan, fal=falta(m), pag=esPagado(m), dif=ej-plan;
  const pct = plan>0 ? Math.min(100, Math.round(ej/plan*100)) : (ej>0?100:0);
  const etiqueta = pag ? (dif>0 ? "sobregiro "+fmt(dif) : dif<0 ? "ahorro "+fmt(-dif) : "pagado")
                       : (ej>0 ? "a medias" : "por pagar");
  abrir(`
    <h2>${esc(m.concepto)}</h2>
    <div class="cap">${fechaLarga(m.fecha)} · ${esc(m.categoria)}${m.bolsa?" · bolsa"+(m.pais?" "+esc(m.pais):""):""} · ${etiqueta}</div>
    <div class="stats">
      <div><div class="eyebrow">Planeado</div><div class="v num">${fmt(plan)}</div></div>
      <div><div class="eyebrow">Pagado</div><div class="v num">${fmt(ej)}</div></div>
      <div><div class="eyebrow">Falta</div><div class="v num ${dif>0?"neg":"pos"}">${fmt(pag?0:fal)}</div></div>
    </div>
    <div class="bar" style="margin-bottom:16px"><i style="width:${pct}%;${dif>0?"background:var(--red)":""}"></i></div>
    ${m.abonos.length ? `<div class="rows" style="margin-bottom:16px">${subsHTML(m)}</div>`
                      : `<div class="empty" style="padding:12px 10px">Sin pagos todavía.</div>`}
    <div class="acts">
      ${pag?"":`<button class="btn" id="b-ab">＋ Abonar</button>`}
      ${(!pag && fal>0)?`<button class="btn ghost" id="b-resto">Pagar el resto · ${fmt(fal)}</button>`:""}
      ${(!pag && ej>0)?`<button class="btn ghost" id="b-cerrar">Cerrar ya · libera ${fmt(fal)}</button>`:""}
      ${(!pag && ej===0)?`<button class="btn ghost" id="b-cerrar">Cerrar sin pagar nada</button>`:""}
      ${pag?`<button class="btn ghost" id="b-re">Reabrir</button>`:""}
      <button class="btn ghost" id="b-ed">Editar</button>
      <button class="btn ghost" id="b-cx">Cerrar hoja</button>
    </div>`);
  sheet.querySelectorAll(".sub").forEach(s=>s.onclick=()=>{
    const a=m.abonos.find(x=>String(x.id)===s.dataset.aid); if(a) hojaAbono(m,a,true);
  });
  if(!pag){
    document.getElementById("b-ab").onclick=()=>hojaAbono(m,null,true);
    const resto=document.getElementById("b-resto");
    if(resto) resto.onclick=()=>hojaAbono(m,null,true,fal);   // abono precargado, un solo mecanismo
    const bc=document.getElementById("b-cerrar");
    let armado = ej>0;   // cerrar sin haber pagado nada pide segundo toque
    bc.onclick=()=>{
      if(!armado){ armado=true; bc.textContent="Confirmar: cerrar sin pagar nada"; bc.classList.add("danger"); return; }
      m.cerradoAMano = true; sync(m);
      guardar(); cerrar(); render();
      aviso(fal>0 ? "Cerrado · libera "+fmt(fal) : "Cerrado");
    };
  }else{
    document.getElementById("b-re").onclick=()=>{
      m.cerradoAMano = false; sync(m);
      guardar(); cerrar(); render();
      aviso(esPagado(m) ? "Sigue pagado: los abonos cubren el plan" : "Reabierto");
    };
  }
  document.getElementById("b-ed").onclick=()=>hojaEditar(m);
  document.getElementById("b-cx").onclick=cerrar;
}

   Nace pagado, con la fecha de hoy y la moneda del país actual. */

  const hoy = hoyISO();
  let mon = monedaPais();

  abrir(`
    <h2>Registrar gasto</h2>
    <div class="cap">Lo no planeado. Se guarda pagado, con fecha de hoy.</div>
    <div id="g-monwrap" style="display:${mon!=="MXN"?"block":"none"}">${chipsMonedaHTML(mon)}</div>
    <input class="big" type="number" inputmode="decimal" id="g-mon" placeholder="0">
    <div class="conv" id="g-conv"></div>
    <div class="atajos" id="g-at"></div>
    <label><span class="lb">Categoría</span>

    <div class="acts"><button class="btn" id="g-ok">Guardar</button></div>

    <div id="g-conwrap" style="display:none">

        <input id="g-con" placeholder="Ramen en Shinjuku"></label></div>
    <div class="acts" style="margin-top:14px"><button class="btn ghost" id="g-cx">Cancelar</button></div>`);
  const inp=document.getElementById("g-mon"), conv=document.getElementById("g-conv");
  const at=document.getElementById("g-at"), conIn=document.getElementById("g-con");
  const enMXN = () => { const v=parseFloat(inp.value)||0; return mon==="MXN" ? Math.round(v) : Math.round(v*S.ajustes.tasas[mon]); };
  const pinta = () => {
    conv.textContent = mon==="MXN" ? "" : `= ${fmt(enMXN())} · tipo de cambio ${S.ajustes.tasas[mon]}`;
    document.getElementById("g-omon").textContent = mon+" ▾";
    at.innerHTML = (ATAJOS[mon]||[]).map(n=>`<button type="button" data-at="${n}">${n.toLocaleString("es-MX")}</button>`).join("");
    at.querySelectorAll("[data-at]").forEach(x=>x.onclick=()=>{ inp.value=x.dataset.at; pinta(); });
  };
  document.getElementById("g-omon").onclick=()=>{
    const w=document.getElementById("g-monwrap");
    w.style.display = w.style.display==="none" ? "block" : "none";
  };
  document.getElementById("g-ocon").onclick=()=>{
    const w=document.getElementById("g-conwrap");
    w.style.display = w.style.display==="none" ? "block" : "none";
    if(w.style.display==="block") conIn.focus();
  };
  document.getElementById("mons").onclick=e=>{
    const t=e.target.closest("[data-mon]"); if(!t) return;
    const antes=mon; mon=t.dataset.mon;
    const v=parseFloat(inp.value);
    if(!isNaN(v) && antes!==mon){
      const mxn = antes==="MXN" ? v : v*S.ajustes.tasas[antes];
      inp.value = mon==="MXN" ? Math.round(mxn) : Math.round(mxn/S.ajustes.tasas[mon]);
    }
    document.querySelectorAll("#mons .chip").forEach(c=>c.classList.toggle("on",c.dataset.mon===mon));
    pinta();
  };
  inp.oninput=pinta; pinta(); inp.focus();
  document.getElementById("g-ok").onclick=()=>{
    const v=parseFloat(inp.value);
    if(isNaN(v)||v<=0) return aviso("Escribe un monto válido");
    const mxn = enMXN();
    const cat = document.getElementById("g-cat").value;
    const con = conIn.value.trim() || cat;
    const m = { id:"g"+Date.now().toString(36), fecha:hoy, concepto:con, categoria:cat,
      tipo:"gasto", montoPlan:mxn, estado:"por_pagar", cerradoAMano:false, nota:"",
      bolsa:false, pais:null, fechaInicio:null, fechaFin:null,
      abonos:[{ id:"a"+Date.now().toString(36), fecha:hoy, monto:mxn,
                moneda:mon, montoLocal:(mon==="MXN"?null:v), concepto:"" }] };
    sync(m);                       // queda pagado porque el abono cubre el plan
    S.movs.push(m);
    if(mon!=="MXN") S.ajustes.monedaUltima = mon;
    guardar(); cerrar(); render();
    aviso("Registrado " + (mon==="MXN" ? fmt(mxn) : v.toLocaleString("es-MX")+" "+mon));
  };
  document.getElementById("g-cx").onclick=cerrar;
}

function hojaEditar(m){
  const nuevo = !m;
  m = m || {id:"m"+Date.now(), fecha:hoyISO(), concepto:"", categoria:"Comida", tipo:"gasto",
            montoPlan:0, estado:"por_pagar", cerradoAMano:false, nota:"",
            bolsa:false, pais:null, fechaInicio:null, fechaFin:null, abonos:[]};
  abrir(`
    <h2>${nuevo?"Nuevo movimiento":"Editar"}</h2>
    <div class="cap">${nuevo?"Nace por pagar.":"Cambia lo que necesites."}</div>
    <label><span class="lb">Concepto</span><input id="e-con" value="${esc(m.concepto)}" placeholder="Ramen en Shinjuku"></label>
    <div class="grid2">
      <label><span class="lb">Fecha</span><input type="date" id="e-fec" value="${m.fecha}"></label>
      <label><span class="lb">Monto planeado (MXN)</span><input type="number" inputmode="decimal" id="e-mon" value="${m.montoPlan}"></label>
    </div>
    <label><span class="lb">Nota (opcional)</span><input id="e-nota" value="${esc(m.nota||"")}" placeholder="Reserva #, recordatorio…"></label>
    <div class="grid2">
      <label><span class="lb">Categoría</span><select id="e-cat">${CATS.map(c=>`<option ${c===m.categoria?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
      <label><span class="lb">Tipo</span><select id="e-tip"><option value="gasto" ${m.tipo==="gasto"?"selected":""}>Gasto</option><option value="ingreso" ${m.tipo==="ingreso"?"selected":""}>Ingreso</option></select></label>
    </div>
    <label><span class="lb">Acceso rápido (bolsa)</span>
      <select id="e-bp">
        <option value="" ${!m.bolsa?"selected":""}>No</option>
        ${PAISES.map(p=>`<option value="${esc(p)}" ${m.bolsa&&m.pais===p?"selected":""}>Sí, en ${esc(p)}</option>`).join("")}
      </select></label>
    <div id="e-reswrap" style="display:${m.bolsa?"block":"none"}">
      <label><span class="lb">Fecha de reserva</span>
        <input type="date" id="e-res" value="${m.fechaInicio||m.fecha}">
        <span class="dd" style="display:block;margin-top:4px">Desde este día el dinero deja de verse disponible, aunque lo gastes después.</span>
      </label></div>
    <div class="acts">
      <button class="btn" id="e-ok">${nuevo?"Agregar movimiento":"Guardar cambios"}</button>
      ${nuevo?"":`<button class="btn danger" id="e-del">Eliminar movimiento</button>`}
      <button class="btn ghost" id="e-cx">Cancelar</button>
    </div>`);
  document.getElementById("e-bp").onchange=e=>{
    document.getElementById("e-reswrap").style.display = e.target.value ? "block" : "none";
  };
  document.getElementById("e-ok").onclick=()=>{
    const con=document.getElementById("e-con").value.trim();
    const mp=parseFloat(document.getElementById("e-mon").value);
    if(!con) return aviso("Falta el concepto");
    if(isNaN(mp)||mp<0) return aviso("Escribe un monto válido");
    const bp=document.getElementById("e-bp").value||null;
    m.bolsa = !!bp; m.pais = bp;      // "bolsa" es sólo la etiqueta de acceso rápido
    m.concepto=con; m.fecha=document.getElementById("e-fec").value;
    // la reserva sólo existe en bolsas; en lo demás se reserva en su propia fecha
    m.fechaInicio = m.bolsa ? (document.getElementById("e-res").value || m.fecha) : null;
    m.nota=document.getElementById("e-nota").value.trim(); m.montoPlan=mp;
    m.categoria=document.getElementById("e-cat").value; m.tipo=document.getElementById("e-tip").value;
    if(!Array.isArray(m.abonos)) m.abonos=[];
    sync(m);                          // cambiar el plan puede cubrirlo o destaparlo
    if(nuevo) S.movs.push(m);
    guardar(); cerrar(); render(); aviso(nuevo?"Movimiento agregado":"Cambios guardados");
  };
  if(!nuevo) document.getElementById("e-del").onclick=()=>{
    S.movs=S.movs.filter(x=>x.id!==m.id); guardar(); cerrar(); render(); aviso("Movimiento eliminado");
  };
  document.getElementById("e-cx").onclick=cerrar;
}

/* Administrar bolsas: asignar país a las que ya existen (una bolsa sin país no
   sale en accesos rápidos) y crear las de Souvenirs que falten. */

  const existe = c => S.movs.some(m=>m.concepto===c);

    <div class="eyebrow" style="margin:16px 0 8px">Crear bolsas de Souvenirs</div>
    ${SOUV.map((s,i)=>`
      <div class="srow">
        <div><div class="lb2">${esc(s.concepto)}${existe(s.concepto)?" · ya existe":""}</div>
          <div class="dd">${esc(s.pais)} · moneda ${MON_PAIS[s.pais]}</div></div>
        <input type="number" inputmode="decimal" data-sv-monto="${i}" value="${s.monto}" ${existe(s.concepto)?"disabled":""}>
      </div>`).join("")}
    <div class="acts" style="margin-top:14px">
      <button class="btn" id="sv-ok">Guardar</button>
      <button class="btn ghost" id="sv-cx">Cancelar</button>
    </div>`);
  document.getElementById("sv-ok").onclick=()=>{
    sheet.querySelectorAll("[data-bp]").forEach(sel=>{
      const m=S.movs.find(x=>x.id===sel.dataset.bp);
      if(m) m.pais = sel.value || null;
    });
    let n=0;
    for(let i=0;i<SOUV.length;i++){
      const s=SOUV[i];
      if(existe(s.concepto)) continue;
      const monto=parseFloat(document.querySelector(`[data-sv-monto="${i}"]`).value);
      if(isNaN(monto)||monto<0) return aviso("Monto inválido en "+s.concepto);
      const nm = { id:"sv"+Date.now().toString(36)+i, fecha:s.ini, concepto:s.concepto,
        categoria:"Souvenirs", tipo:"gasto", montoPlan:monto, estado:"por_pagar",
        cerradoAMano:false, nota:"", bolsa:true, pais:s.pais,
        fechaInicio:s.ini, fechaFin:s.fin, abonos:[] };
      sync(nm); S.movs.push(nm); n++;
    }
    guardar(); cerrar(); render();
    aviso(n ? n+" bolsa"+(n===1?"":"s")+" de Souvenirs creada"+(n===1?"":"s") : "Bolsas actualizadas");
  };
  document.getElementById("sv-cx").onclick=cerrar;
}

function enlazar(){
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render();});
  view.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{
    const m=S.movs.find(x=>x.id===b.dataset.qk); if(m) hojaAbono(m,null,false); });
  view.querySelectorAll("[data-mov]").forEach(b=>b.onclick=()=>{
    const m=S.movs.find(x=>x.id===b.dataset.mov); if(m) hojaMov(m); });
  view.querySelectorAll(".subs .sub").forEach(s=>s.onclick=()=>{
    const b=S.movs.find(x=>x.id===s.dataset.bid); if(!b) return;
    const a=b.abonos.find(x=>String(x.id)===s.dataset.aid); if(a) hojaAbono(b,a,false); });
  view.querySelectorAll(".row").forEach(r=>{
    const m=S.movs.find(x=>x.id===r.dataset.id); if(!m) return;
    // toda la fila abre LA hoja. Sin ✓ separado: eso es lo que confundía.
    r.querySelector('.hit').onclick=()=>hojaMov(m);
    const ex=r.querySelector('[data-act="expand"]');
    if(ex) ex.onclick=e=>{ e.stopPropagation();
      if(abiertos.has(m.id)) abiertos.delete(m.id); else abiertos.add(m.id);
      render(); };
  });
  const rg=document.getElementById("reg");
  if(rg) rg.onclick=hojaRapido;
  const ps=document.getElementById("paises");
  if(ps) ps.onclick=e=>{
    const b=e.target.closest("[data-pais]"); if(!b) return;
    S.ajustes.paisActual=b.dataset.pais; guardar(); render();
    aviso("País: "+b.dataset.pais+" · moneda "+monedaPais());
  };
  const sv=document.getElementById("souv");
  if(sv) sv.onclick=hojaBolsas;
  const si=document.getElementById("gsi");
  if(si) si.onclick=()=>{ const v=parseFloat(document.getElementById("si").value);
    if(isNaN(v)) return aviso("Monto inválido");
    S.ajustes.saldoInicial=v; guardar(); render(); aviso("Saldo inicial actualizado"); };
  const gt=document.getElementById("gtasas");
  if(gt) gt.onclick=()=>{ document.querySelectorAll("[data-tasa]").forEach(i=>{
      const v=parseFloat(i.value); if(!isNaN(v)&&v>0) S.ajustes.tasas[i.dataset.tasa]=v; });
    guardar(); render(); aviso("Tipos de cambio actualizados"); };
  const ex=document.getElementById("exp");
  if(ex) ex.onclick=async()=>{
    const json=JSON.stringify(S,null,1), nombre="asia2026-"+hoyISO()+".json";
    const file=new File([json],nombre,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:"Respaldo Asia 2026"}); aviso("Respaldo compartido"); return; }
      catch(e){ if(e.name==="AbortError") return; }
    }
    try{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
      aviso("Respaldo descargado");
    }catch(e){
      abrir(`<h2>Tu respaldo</h2><div class="cap">Copia este texto y guárdalo en Notas o donde prefieras.</div>
        <textarea readonly id="jout">${esc(json)}</textarea>
        <div class="acts"><button class="btn" id="jcp">Copiar todo</button><button class="btn ghost" id="jcx2">Cerrar</button></div>`);
      document.getElementById("jcp").onclick=()=>{document.getElementById("jout").select();document.execCommand("copy");aviso("Copiado");};
      document.getElementById("jcx2").onclick=cerrar;
    } };
  const im=document.getElementById("imp");
  if(im) im.onclick=()=>{
    abrir(`<h2>Restaurar desde respaldo</h2><div class="cap">Elige el archivo .json de tu respaldo. Reemplaza todo lo que tienes ahora.</div>
      <div class="acts">
        <button class="btn" id="jfile">Elegir archivo…</button>
        <input type="file" id="jinput" accept=".json,application/json" style="display:none">
        <button class="btn ghost" id="jpaste">O pegar el texto</button>
        <button class="btn ghost" id="jcx">Cancelar</button>
      </div>`);
    const aplicar=txt=>{
      try{ const d=JSON.parse(txt);
        if(!d.ajustes||!Array.isArray(d.movs)) throw 0;
        d.movs.forEach(m=>{ if(!m.id||!m.fecha||typeof m.montoPlan!=="number") throw 0;
          if(m.abonos!=null && !Array.isArray(m.abonos)) throw 0; });
        S=migrar(d);   // un respaldo viejo (sin abonos) se normaliza aquí, sin perder nada
        abiertos=new Set();
        guardar(); cerrar(); render(); aviso("Respaldo restaurado ("+d.movs.length+" movimientos)");
      }catch(e){ aviso("El archivo no es un respaldo válido"); } };
    document.getElementById("jfile").onclick=()=>document.getElementById("jinput").click();
    document.getElementById("jinput").onchange=e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>aplicar(r.result); r.readAsText(f); };
    document.getElementById("jpaste").onclick=()=>{
      abrir(`<h2>Pegar respaldo</h2><div class="cap">Pega aquí el contenido del .json.</div>
        <textarea id="jj" placeholder="{ ... }"></textarea>
        <div class="acts"><button class="btn" id="jok">Restaurar</button><button class="btn ghost" id="jcx3">Cancelar</button></div>`);
      document.getElementById("jok").onclick=()=>aplicar(document.getElementById("jj").value);
      document.getElementById("jcx3").onclick=cerrar; };
    document.getElementById("jcx").onclick=cerrar; };
  const rs=document.getElementById("reset");
  if(rs) rs.onclick=()=>{
    abrir(`<h2>Volver al plan original</h2><div class="cap">Se borran tus confirmaciones y los movimientos que hayas creado. Descarga un respaldo antes si quieres conservarlos.</div>
      <div class="acts"><button class="btn danger" id="rok">Sí, volver al plan original</button><button class="btn ghost" id="rcx">Cancelar</button></div>`);
    document.getElementById("rok").onclick=()=>{ const aj=S.ajustes; S=nuevoEstado(); S.ajustes=aj; migrar(S); abiertos=new Set(); guardar(); cerrar(); render(); aviso("Plan restaurado"); };
    document.getElementById("rcx").onclick=cerrar; };
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;window.scrollTo(0,0);render();});
document.getElementById("fab").onclick=()=>hojaEditar(null);
render();

/* Si la migración reabrió movimientos que v1.3 había dado por pagados sin
   cubrir el plan, se dice en voz alta: su remanente vuelve al proyectado. */
if(REABIERTOS>0){
  guardar();
  setTimeout(()=>aviso(REABIERTOS===1
    ? "1 movimiento estaba pagado a medias y volvió a quedar abierto"
    : REABIERTOS+" movimientos estaban pagados a medias y volvieron a quedar abiertos"), 700);
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheet.classList.contains("on")) cerrar(); });
</script>
</body>
